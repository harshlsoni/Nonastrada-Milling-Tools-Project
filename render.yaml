services:
  - type: web
    name: milling-tool-monitor
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: UPLOAD_FOLDER
        value: /app/uploads
      - key: PORT
        value: 5000
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
